name: Django library CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[dev]'
      - run: ruff check pyscoped tests examples
      - run: ruff format --check pyscoped tests examples
      - run: python -m django check --settings=tests.settings
      - run: python -m django makemigrations --check --dry-run --settings=tests.settings

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.10', django: '>=5.2,<5.3'}
          - {python: '3.11', django: '>=5.2,<5.3'}
          - {python: '3.12', django: '>=5.2,<5.3'}
          - {python: '3.13', django: '>=5.2,<5.3'}
          - {python: '3.14', django: '>=5.2.8,<5.3'}
          - {python: '3.12', django: '>=6.0,<6.1'}
          - {python: '3.13', django: '>=6.0,<6.1'}
          - {python: '3.14', django: '>=6.0,<6.1'}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pyscoped_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pyscoped_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pyscoped_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev,postgres]' 'Django${{ matrix.django }}'
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          PYSCOPED_POSTGRES: '1'
          PGPORT: '5432'
          PGPASSWORD: test-only

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[dev]'
      - run: python -m build
      - run: twine check dist/*
      - run: python tests/packaging_smoke.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: pyscoped-distributions
          path: dist/
