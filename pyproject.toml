[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pyscoped"
version = "2.0.0"
description = "Incremental tenant scoping and transactional audit history for Django"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "KWIP"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Programming Language :: Python :: 3",
]
dependencies = ["Django>=5.2,<6.1"]

[project.urls]
Homepage = "https://github.com/kwip-info/pyscoped"
Repository = "https://github.com/kwip-info/pyscoped"
Issues = "https://github.com/kwip-info/pyscoped/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.11", "pytest-asyncio>=1", "ruff>=0.12", "build>=1.2", "twine>=6"]
postgres = ["psycopg[binary]>=3.2"]

[tool.hatch.build.targets.wheel]
packages = ["pyscoped"]

[tool.hatch.build.targets.sdist]
include = ["/pyscoped", "/tests", "/examples", "/docs", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/LICENSE", "/AGENTS.md", "/CLAUDE.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: PostgreSQL-specific concurrency validation"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
